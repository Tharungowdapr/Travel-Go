<!DOCTYPE html>
<html>
<head>
    <title>TravelGo Registration Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>TravelGo Registration Test</h1>
    <p>This page tests the registration API directly without React.</p>
    
    <form id="registrationForm">
        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="username" required value="testuser_">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" required value="test@example.com">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" required value="Test123!">
        </div>
        <div class="form-group">
            <label>First Name:</label>
            <input type="text" id="fname" required value="Test">
        </div>
        <div class="form-group">
            <label>Last Name:</label>
            <input type="text" id="lname" required value="User">
        </div>
        <div class="form-group">
            <label>Age:</label>
            <input type="number" id="age" required value="25">
        </div>
        <div class="form-group">
            <label>Gender:</label>
            <select id="gender" style="width: 100%; padding: 8px;">
                <option value="M">Male</option>
                <option value="F">Female</option>
                <option value="O">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Address:</label>
            <input type="text" id="address" required value="123 Test Street">
        </div>
        <button type="submit">Register</button>
    </form>
    
    <div id="result"></div>

    <script>
        // Add timestamp to username on page load
        document.getElementById('username').value = 'testuser_' + Date.now();
        document.getElementById('email').value = 'test_' + Date.now() + '@example.com';

        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Registering...';
            resultDiv.className = '';
            
            const userData = {
                UserName: document.getElementById('username').value,
                Email: document.getElementById('email').value,
                Password: document.getElementById('password').value,
                FName: document.getElementById('fname').value,
                LName: document.getElementById('lname').value,
                Age: parseInt(document.getElementById('age').value),
                Gender: document.getElementById('gender').value,
                Address: document.getElementById('address').value
            };
            
            try {
                console.log('Sending registration request to: http://localhost:5001/api/auth/register');
                console.log('Data:', userData);
                
                const response = await fetch('http://localhost:5001/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });
                
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok && data.success) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h3>✅ Registration Successful!</h3>
                        <p><strong>User ID:</strong> ${data.data.UserID}</p>
                        <p><strong>Username:</strong> ${data.data.UserName}</p>
                        <p><strong>Token:</strong> ${data.token.substring(0, 50)}...</p>
                    `;
                } else {
                    throw new Error(data.error || 'Registration failed');
                }
            } catch (error) {
                console.error('Registration error:', error);
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h3>❌ Registration Failed</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Check:</strong></p>
                    <ul>
                        <li>Is the backend running on port 5001?</li>
                        <li>Check browser console for CORS errors</li>
                        <li>Verify network tab in DevTools</li>
                    </ul>
                `;
            }
        });
    </script>
</body>
</html>
